plugins { id 'com.android.application' }

android {
    namespace 'io.github.op7418.guizangtv'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.op7418.lumatv.publicui'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.6.0-public'
    }
    signingConfigs {
        release {
            if (System.getenv('LUMA_KEYSTORE')) {
                storeFile file(System.getenv('LUMA_KEYSTORE'))
                storePassword System.getenv('LUMA_STORE_PASSWORD')
                keyAlias System.getenv('LUMA_KEY_ALIAS') ?: 'luma-tv'
                keyPassword System.getenv('LUMA_KEY_PASSWORD') ?: System.getenv('LUMA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('LUMA_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
